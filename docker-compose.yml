version: "3.9"

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: kalasathi_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kalasathi}
      POSTGRES_USER: ${POSTGRES_USER:-kalasathi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kalasathi_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kalasathi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kalasathi_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MongoDB (queryable image-job output JSON) ───────────────────────────────
  mongo:
    image: mongo:7
    container_name: kalasathi_mongodb
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── S3-compatible object storage (RustFS; MinIO API-compatible) ─────────────
  minio-init:
    image: alpine:3.21
    command: ["sh", "-c", "mkdir -p /data/rustfs0 /app/logs && chown -R 10001:10001 /data/rustfs0 /app/logs"]
    volumes:
      - minio_data:/data/rustfs0
      - minio_logs:/app/logs
    restart: "no"

  minio:
    image: rustfs/rustfs:latest
    container_name: kalasathi_minio
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOG_DIRECTORY: /app/logs
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    volumes:
      - minio_data:/data/rustfs0
      - minio_logs:/app/logs
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 20s
      retries: 3
    depends_on:
      minio-init:
        condition: service_completed_successfully

  # ─── Main Backend API ────────────────────────────────────────────────────────
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: kalasathi_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kalasathi}:${POSTGRES_PASSWORD:-kalasathi_secret}@postgres:5432/${POSTGRES_DB:-kalasathi}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-kalasathi-media}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      CREWAI_API_BASE_URL: ${CREWAI_API_BASE_URL:-https://karigarai-product-image-processing-agent-v1-4812b293.crewai.com}
      CREWAI_BEARER_TOKEN: ${CREWAI_BEARER_TOKEN:-}
      AI_MOCK_MODE: ${AI_MOCK_MODE:-true}
      MONGODB_URI: ${MONGODB_URI_DOCKER:-mongodb://mongo:27017/kalasathi}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-kalasathi}
      MONGODB_REQUIRED: ${MONGODB_REQUIRED:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_in_production}
      JWT_ALGORITHM: HS256
      AI_SERVICE_URL: http://ai:8001
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./services/api:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      mongo:
        condition: service_healthy
    working_dir: /app

  # ─── AI Microservice ─────────────────────────────────────────────────────────
  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: kalasathi_ai
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BHASHINI_API_KEY: ${BHASHINI_API_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      AI_MOCK_MODE: ${AI_MOCK_MODE:-true}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-kalasathi-media}
    volumes:
      - ./services/ai:/app
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    working_dir: /app

  # ─── Web Frontend (Next.js) ──────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: kalasathi_web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_RAZORPAY_KEY: ${RAZORPAY_KEY_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      - api
    profiles:
      - web   # run with: docker compose --profile web up

volumes:
  postgres_data:
  redis_data:
  minio_data:
  minio_logs:
  mongodb_data:
